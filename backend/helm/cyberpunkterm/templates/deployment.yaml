apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cyberpunkterm.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cyberpunkterm.labels" . | nindent 4 }}
    {{- include "cyberpunkterm.backend.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "cyberpunkterm.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cyberpunkterm.labels" . | nindent 8 }}
        {{- include "cyberpunkterm.backend.selectorLabels" . | nindent 8 }}
      {{- with .Values.backend.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "cyberpunkterm.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: PORT
              value: "8000"
            - name: METRICS_INTERVAL_SECONDS
              value: {{ .Values.backend.env.METRICS_INTERVAL_SECONDS | quote }}
            {{- if .Values.backend.kubeconfigSecret }}
            - name: KUBECONFIG
              value: /etc/kubeconfig/config
            {{- end }}
          {{- if .Values.backend.kubeconfigSecret }}
          volumeMounts:
            - name: kubeconfig
              mountPath: /etc/kubeconfig
              readOnly: true
          {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.backend.healthPath }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: {{ .Values.backend.healthPath }}
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      {{- if .Values.backend.kubeconfigSecret }}
      volumes:
        - name: kubeconfig
          secret:
            secretName: {{ .Values.backend.kubeconfigSecret }}
      {{- end }}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
