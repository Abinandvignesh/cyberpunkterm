# ──────────────────────────────────────────────────────────────────────────────
# CyberpunkTerm CI
# Runs on every push and PR:
#   1. Lint frontend (ESLint)
#   2. Build frontend (Vite)
#   3. Lint backend (ruff)
#   4. Lint Helm chart (helm lint)
#   5. Build Docker images (no push on PRs, push on main/tags)
# ──────────────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ${{ github.repository_owner }}/cyberpunkterm-backend
  TOOLBOX_IMAGE: ${{ github.repository_owner }}/cyberpunkterm-toolbox

jobs:
  # ── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # ── Backend ─────────────────────────────────────────────────────────────────
  backend:
    name: Backend — lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/cyberterminalbackend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/cyberterminalbackend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Lint (ruff)
        run: ruff check main.py

  # ── Helm ────────────────────────────────────────────────────────────────────
  helm:
    name: Helm — lint & template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: "v3.17.0"

      - name: Lint chart
        run: helm lint backend/helm/cyberpunkterm

      - name: Dry-run template render
        run: |
          helm template cyberterm backend/helm/cyberpunkterm \
            --set backend.image.repository=ghcr.io/example/cyberpunkterm-backend \
            --set toolbox.image.repository=ghcr.io/example/cyberpunkterm-toolbox \
            --debug

  # ── Docker — build (and push on main / tags) ──────────────────────────────
  docker:
    name: Docker — build & push
    runs-on: ubuntu-latest
    needs: [frontend, backend, helm]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Resolve image tag ──────────────────────────────────────────────────
      - name: Compute image tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      # ── Toolbox image ──────────────────────────────────────────────────────
      - name: Build & push toolbox
        uses: docker/build-push-action@v6
        with:
          context: backend/toolbox
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.TOOLBOX_IMAGE }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Backend image ──────────────────────────────────────────────────────
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: backend/cyberterminalbackend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
